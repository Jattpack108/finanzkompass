<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <style>
    .fg  { fill: #1C1917; }
    .dot { fill: #B45309; }
    @media (prefers-color-scheme: dark) {
      .fg  { fill: #FAFAF9; }
      .dot { fill: #FBBF24; }
    }
  </style>
  <!-- Square plate with rounded corners (Apple touch icon requires opaque bg) -->
  <rect width="128" height="128" rx="22" fill="#FAFAF9"/>
  <!-- Letter F (Fraunces-inspired) -->
  <path class="fg" d="M28 22h64v18H54v22h32v18H54v36H28V22z"/>
  <!-- Brand dot -->
  <circle class="dot" cx="100" cy="98" r="10"/>
</svg>
