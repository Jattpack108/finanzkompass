name = "finanzkompass"
# account_id is inferred from the API token; not allowed in Pages wrangler.toml
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "./dist"

[[d1_databases]]
binding = "DB"
database_name = "finanzkompass-db"
database_id = "34b23557-3dfc-4066-80bd-287987a1403b"
migrations_dir = "migrations"

[vars]
PUBLIC_SITE_URL = "https://finanzkompass.de"
